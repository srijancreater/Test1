name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Agent fleet stress test (offline, 1000 workers)
        run: python -m agent_fleet demo --tasks 2000
      - name: Build sample dashboard
        run: python -m tender_radar scan data/sample_tenders.csv --html out/index.html --csv out/tenders.csv
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: tender-radar-report
          path: out/
